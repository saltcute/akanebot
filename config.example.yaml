# Copy to config.yaml to customize. config.yaml is ignored by git.
# Secrets stay in .env; this file only names models and limits.

persona: personas/akane.md

# true: she reads and decides but posts nothing, and "[would say]" lines show what she'd have sent.
# Set to false only when you're ready for her to talk. A group can override this with its own shadow setting.
shadow: true

# The bot goes silent for the rest of the UTC day once it has spent this much.
dailyBudgetUsd: 2

# How many pictures from the chat she looks at again while writing one reply, so she can answer about them and compare them.
# Each costs about as much as a few thousand characters of text. 0 leaves her with one-line descriptions only.
# They're shrunk to maxEdge pixels on the long edge first, which keeps a phone screenshot from costing several times more. 0 sends them as they are.
# A GIF is always shown as a sheet of a few of its frames, which fits inside maxEdge, or 1024 when it's 0.
pictures:
  perReply: 3
  maxEdge: 1024

# Runs on the CPU. The score band is specific to this model, so re-measure it if you change the model.
embedder:
  type: transformers
  model: Xenova/multilingual-e5-small
  cosineFloor: 0.84
  cosineCeiling: 0.92

# Web search for topics she's curious about. Set type: none to turn it off.
search:
  type: anthropic
  model: claude-sonnet-5-5
  maxUses: 2

# Opening links people post. Whether she opens one at all is the persona's `links`.
# YouTube, X, Bilibili and GitHub are read from their own APIs with only the ID; set YOUTUBE_API_KEY in .env to get video descriptions.
# Any other page goes to the reader, which fetches it from the vendor's servers so this machine never connects to it. Set type: none to turn that off.
# Invites, logins, unsubscribe links, document and file-sharing hosts, and links that carry a key are never opened.
links:
  reader:
    type: anthropic
    model: claude-sonnet-5-5
    maxContentTokens: 6000
  sites: true
  blockedHosts: []
  # When the reader can't read a page, fetch it from this machine instead. Only the title and description are read, private
  # addresses are refused and every redirect is checked, but the page's owner sees this machine's IP and that the link was opened.
  direct:
    enabled: false

memory:
  path: data/memory.db
  segmentGapMinutes: 20
  maxSegmentMessages: 60
  rawRetentionDays: 30
  dailyWritesPerUser: 30

control:
  commandPrefix: /akanebot
  # platform:userId of each admin. These can run mute, unmute, kill, resume and status.
  admins: []
  # The bot acts ONLY in groups listed here with disclosed: true, meaning members have been told it's an AI persona.
  groups: []
  #  - { platform: discord, channelId: "123456789", disclosed: true }
  #  - { platform: qq, channelId: "123456789", disclosed: true }
  # Memories marked general can come up in other listed groups. shareMemory: false walls a group off in both directions.
  #  - { platform: qq, channelId: "987654321", disclosed: true, shareMemory: false }
  # shadow on a group overrides the top-level setting, so she can talk in one group while only watching another.
  #  - { platform: discord, channelId: "555555555", disclosed: true, shadow: false }

# Links one person's accounts, and says how she knows them. Keep real IDs in your own config.yaml, which git ignores.
# The same account in two groups is already one person, so list someone only to link platforms or add a note.
# She sees the note only while that account is talking, so it can't be claimed by copying a nickname.
# aliases are other names people call them by, two characters or longer. When one comes up, she's told whose nickname it is, and nothing about who's talking.
# timezone is their IANA zone. While they're in the conversation, or someone there names them, she's told what time it is for them, which beats her guess from the platform.
# Opting out or being forgotten covers all of a person's accounts. Admin rights stay per account.
people: []
#  - { name: 土豆, ids: ["discord:123456789", "qq:123456789"], note: 关系很好的网友，经常一起聊音游, aliases: [薯仔, potato], timezone: America/Toronto }

# NapCat or another OneBot 11 server, needed for any group with platform: qq.
# qq:
#   url: ws://127.0.0.1:3001

# The operator's web UI, for viewing and managing everything about her: conversations, memories, people, her state and the logs.
# It shows private chat, so it needs a token:
# set AKANEBOT_WEB_TOKEN in .env, or the bot makes one up at startup and prints a sign-in link.
# It has no TLS. Keep it on 127.0.0.1 and use an SSH tunnel to reach it from another machine.
web:
  enabled: true
  host: 127.0.0.1
  port: 8787

backends:
  anthropic: { type: anthropic }

# Each job picks its own model. Change a model here and no code needs to change.
# `options` are passed straight to that backend.
roles:
  gate:
    backend: anthropic
    model: claude-haiku-5-5
    options: { effort: low, thinking: { type: disabled } }
  reply:
    backend: anthropic
    model: claude-opus-5-5
    options: { effort: low, refusalFallback: true }
  technical:
    backend: anthropic
    model: claude-opus-5-5
    options: { effort: medium, refusalFallback: true }

  vision:
    backend: anthropic
    model: claude-haiku-5-5
    options: { effort: low, thinking: { type: disabled } }
  extract:
    backend: anthropic
    model: claude-haiku-5-5
    options: { effort: low, thinking: { type: disabled } }
  consolidate:
    backend: anthropic
    model: claude-sonnet-5-5
    options: { effort: low }

# Dollars per million tokens, used by the cost meter and the daily budget.
prices:
  claude-haiku-5-5: { input: 0.10, cachedInput: 0.01, output: 0.50 }
  claude-sonnet-5-5: { input: 2.00, cachedInput: 0.20, output: 10.00, webSearch: 0.01 }
  claude-opus-5-5: { input: 4.00, cachedInput: 0.20, output: 20.00 }
