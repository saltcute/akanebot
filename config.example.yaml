# Copy to config.yaml to customize. config.yaml is ignored by git.
# Secrets stay in .env; this file only names models and limits.

persona: personas/akane.md

# The bot goes silent for the rest of the UTC day once it has spent this much.
dailyBudgetUsd: 2

# Runs on the CPU. The score band is specific to this model, so re-measure it if you change the model.
embedder:
  type: transformers
  model: Xenova/multilingual-e5-small
  cosineFloor: 0.84
  cosineCeiling: 0.92

memory:
  path: data/memory.db
  segmentGapMinutes: 20
  maxSegmentMessages: 60
  rawRetentionDays: 30
  dailyWritesPerUser: 30

control:
  commandPrefix: /gabriel
  # platform:userId of each admin. These can run mute, unmute, kill, resume and status.
  admins: []
  # The bot acts ONLY in groups listed here with disclosed: true, meaning members have been told it's an AI persona.
  groups: []
  #  - { platform: discord, channelId: "123456789", disclosed: true }
  # Shown to anyone who may be in crisis. Check these are right for where your members live.
  crisisResources: "Canada and US: call or text 988. China: call 12356. Elsewhere: your local emergency number."

backends:
  anthropic: { type: anthropic }

# Each job picks its own model. Change a model here and no code needs to change.
# `options` are passed straight to that backend.
roles:
  gate:
    backend: anthropic
    model: claude-haiku-5-5
    options: { effort: low, thinking: { type: disabled } }
  reply:
    backend: anthropic
    model: claude-opus-5-5
    options: { effort: low, refusalFallback: true }
  technical:
    backend: anthropic
    model: claude-opus-5-5
    options: { effort: medium, refusalFallback: true }

  crisis:
    backend: anthropic
    model: claude-opus-5-5
    options: { effort: medium, refusalFallback: true }

  extract:
    backend: anthropic
    model: claude-haiku-5-5
    options: { effort: low, thinking: { type: disabled } }
  consolidate:
    backend: anthropic
    model: claude-sonnet-5-5
    options: { effort: low }

# Dollars per million tokens, used by the cost meter and the daily budget.
prices:
  claude-haiku-5-5: { input: 0.10, cachedInput: 0.01, output: 0.50 }
  claude-sonnet-5-5: { input: 2.00, cachedInput: 0.20, output: 10.00 }
  claude-opus-5-5: { input: 4.00, cachedInput: 0.20, output: 20.00 }
